# ==========================================
# PostgreSQL Configuration
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5433/consultorioapp
spring.datasource.username=postgres
spring.datasource.password=92188162
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA/Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# Server Configuration
# ==========================================
server.port=8080

# ==========================================
# CORS Configuration (¡IMPORTANTE!)
# ==========================================
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:3001
spring.web.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# ==========================================
# Logging (opcional - para debugging)
# ==========================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

